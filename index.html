<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE CREATORS — Build. Break. On Demand.</title>
    <meta name="description" content="Premium technology and creative engineering studio delivering websites, applications, custom software, video editing, game mods, and graphic design on demand." />
    <meta property="og:title" content="THE CREATORS — Build. Break. On Demand." />
    <meta property="og:description" content="Premium technology and creative engineering studio delivering websites, applications, custom software, video editing, game mods, and graphic design on demand." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/the-creators-logo.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('tc_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            if (systemDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#05050a] text-[#ecebf6] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
